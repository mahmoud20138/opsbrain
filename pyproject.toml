[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "opsbrain"
version = "0.1.0"
description = "Multi-agent LLM-powered enterprise operations monitoring and process optimization framework"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "OpsBrain Contributors" },
]
keywords = [
    "llm",
    "multi-agent",
    "operations",
    "monitoring",
    "anomaly-detection",
    "root-cause-analysis",
    "enterprise",
    "ai",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Monitoring",
    "Topic :: System :: Systems Administration",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]

dependencies = [
    "typer>=0.12.0",
    "rich>=13.0.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "structlog>=24.0.0",
    "httpx>=0.27.0",
    "litellm>=1.40.0",
    "tenacity>=8.2.0",
    "pyyaml>=6.0",
    "aiofiles>=24.0.0",
]

[project.optional-dependencies]
openai = ["openai>=1.30.0"]
gemini = ["google-genai>=1.0.0"]
anthropic = ["anthropic>=0.30.0"]
ollama = ["ollama>=0.3.0"]
all-providers = [
    "openai>=1.30.0",
    "google-genai>=1.0.0",
    "anthropic>=0.30.0",
    "ollama>=0.3.0",
]
rag = [
    "chromadb>=0.5.0",
    "sentence-transformers>=3.0.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
    "pre-commit>=3.7.0",
]

[project.scripts]
opsbrain = "opsbrain.cli.app:app"

[project.urls]
Homepage = "https://github.com/opsbrain/opsbrain"
Documentation = "https://opsbrain.readthedocs.io"
Repository = "https://github.com/opsbrain/opsbrain"
Issues = "https://github.com/opsbrain/opsbrain/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/opsbrain"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501", "BLE001", "SIM102", "SIM103", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["F401", "F841"]
"examples/**" = ["T201"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
asyncio_mode = "auto"
addopts = "-v --tb=short"
